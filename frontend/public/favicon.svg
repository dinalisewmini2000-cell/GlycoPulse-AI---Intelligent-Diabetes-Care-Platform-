<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dropGrad" x1="12" y1="4" x2="52" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B60"/>
      <stop offset="100%" stop-color="#D91B42"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D91B42" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Blood Drop Symbol -->
  <path d="M32 6C32 6 12 28 12 40C12 51.0457 20.9543 60 32 60C43.0457 60 52 51.0457 52 40C52 28 32 6 32 6Z" 
        fill="url(#dropGrad)" 
        filter="url(#glow)"/>

  <!-- Glycemic Pulse Waveform -->
  <path d="M18 39H25L28.5 32L32.5 45L36.5 34L39.5 40H46" 
        stroke="url(#pulseGrad)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- AI Sparkle Dot -->
  <circle cx="41" cy="22" r="3" fill="#38BDF8"/>
  <circle cx="41" cy="22" r="1.5" fill="#FFFFFF"/>
</svg>