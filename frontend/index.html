<!doctype html>
<html lang="en" data-theme="dark" style="background-color: #0b0f19; color: #f1f5f9; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GlucoCare - Diabetes Clinical Management Platform with Blood Glucose Telemetry, Food Vision Analysis, Lab OCR, Complication Monitoring, and Remote Clinical Portals." />
    <title>GlucoCare – Diabetes Clinical Management Platform</title>

    <!-- Google Fonts Preconnect & Load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Anti-FOUC Theme Script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('glycopulse_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'light') {
            document.documentElement.style.backgroundColor = '#f8fafc';
            document.documentElement.style.color = '#0f172a';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Inline Critical CSS -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0b0f19;
        color: #f1f5f9;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      [data-theme="light"], [data-theme="light"] body {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }
      #root {
        min-height: 100vh;
        background-color: inherit;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
